plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
}

android {
    namespace 'com.brainnet.pixelforge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.brainnet.pixelforge'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.0'
        ndk {
            abiFilters += "arm64-v8a"
        }
    }


    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts.add("**/libLiteRt.so")
            pickFirsts.add("**/libLiteRtDispatch_GoogleTensor.so")
            pickFirsts.add("**/libLiteRtClGlAccelerator.so")
        }
    }
}

dependencies {
    // LiteRT-LM Kotlin SDK
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.12.0'
    implementation 'com.google.ai.edge.litert:litert:2.1.5'

    // Ktor embedded server (OpenAI-compatible HTTP)
    implementation 'io.ktor:ktor-server-core:2.3.12'
    implementation 'io.ktor:ktor-server-cio:2.3.12'
    implementation 'io.ktor:ktor-server-content-negotiation:2.3.12'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.12'

    // Kotlin serialization (for JSON request/response models)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Networking (model download)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}

configurations.all {
    exclude(group: "com.google.ai.edge.litert", module: "litert-api")
}
